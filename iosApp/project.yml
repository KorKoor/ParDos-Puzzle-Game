# Proyecto de Xcode de ParDos para iPhone. Se genera con XcodeGen (`xcodegen generate`), así que no se versiona el .xcodeproj.
# La lógica del juego viene de ../shared (Kotlin) como Shared.xcframework, que construye Gradle antes de compilar esto.
name: ParDos

options:
  bundleIdPrefix: com.korkoor
  developmentLanguage: es
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 10.14.0
  # Firebase 10.29.0 es la última serie que convive con GoogleMobileAds 10.14.0 (este pide GoogleAppMeasurement < 11).
  # Para pasar a Firebase 11 o más hay que subir antes GoogleMobileAds a 11+ (los nombres GAD* cambian).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 10.29.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ParDos:
    type: application
    platform: iOS
    sources:
      - path: ParDos
    info:
      path: ParDos/Info.plist
      properties:
        CFBundleDisplayName: ParDos
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Light
        # Identificador de PRUEBA de Google (cambiar por el real de AdMob antes de publicar)
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        CFBundleLocalizations: [es, en]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.korkoor.pardos.ios
        PRODUCT_NAME: ParDos
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconHalloween
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Sin firmar: Sideloadly firma el .ipa con tu Apple ID al instalarlo
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        # El runtime de Kotlin/Native (framework estático) necesita la librería de C++
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-ObjC"]
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
      - package: GoogleMobileAds
      - package: Firebase
        product: FirebaseCore
